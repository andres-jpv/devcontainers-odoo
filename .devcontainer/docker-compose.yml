services:
  odoo18-demo:
    container_name: odoo18-demo
    # image: mjavint/odoodev:18.0
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace
      - ${ODOO_SERVER}:/workspace/odoo.18.0:ro
      # - ${ENTERPRISE_ADDONS}:/workspace/enterprise.18.0:ro
      - odoo18-data:/var/lib/odoo
    depends_on:
      - pgdb
    command: sleep infinity
    ports:
      - "8169:8069"
      - "8171:8071"
      - "8172:8072"
    networks:
      - shared-net-18

  pgdb:
    image: postgres:17.0-alpine
    restart: unless-stopped
    container_name: pgdb18
    volumes:
      - pgdb18-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    environment:
      - POSTGRES_PASSWORD=admin
    ports:
      - "5433:5432"
    networks:
      - shared-net-18

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "8185:80"
    container_name: pgadmin18
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin18-data:/var/lib/pgadmin
    networks:
      - shared-net-18

volumes:
  odoo18-data:
  pgdb18-data:
  pgadmin18-data:

networks:
  shared-net-18:
    driver: bridge
